[project]
name = "wodbuster-worker"
version = "0.1.0"
description = "Unattended WodBuster Booking Scheduler (FastAPI + APScheduler + Postgres on Azure Container Apps)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WodBuster Booking Scheduler contributors" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "jinja2>=3.1,<4.0",
    "apscheduler>=3.10,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "curl-cffi>=0.13,<1.0",
    "structlog>=24.1,<26.0",
    "azure-identity>=1.19,<2.0",
    "azure-keyvault-secrets>=4.9,<5.0",
    "azure-communication-email>=1.0,<2.0",
    "authlib>=1.3,<2.0",
    "itsdangerous>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-telegram-bot>=21.0,<23.0",
    "cryptography>=43.0,<46.0",
    "pydantic-settings>=2.5,<3.0",
    # US2.6 observability: Azure Monitor OpenTelemetry distro. Ships
    # auto-instrumentation for FastAPI, httpx, SQLAlchemy and a
    # metrics + logs + traces exporter to Application Insights.
    "azure-monitor-opentelemetry>=1.6,<2.0",
]

[project.optional-dependencies]
# Exact pins, not ranges. Every entry here gates CI, and a linter or type
# checker that adds a rule in a minor release turns an unrelated pull
# request red: djlint 1.46 shipped H044 and broke a change that touched no
# templates. Ranges also let CI and a developer's machine resolve different
# versions, so a green local run stopped predicting a green CI run.
# Runtime dependencies above stay on ranges deliberately: they are resolved
# once per image build and their compatibility is covered by the suite.
#
# Bumping: raise the pin in its own commit, run the full suite, and fix the
# new findings there. Never as a side effect of a feature branch.
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.16.8",
    "mypy==1.20.2",
    # 1.46.1 rather than the newest patch: 1.46.2 ships no wheel for the
    # Python 3.14 some contributors run locally, and a pin that only
    # installs on the CI interpreter defeats the purpose.
    "djlint==1.46.1",
    # Accessibility audits parse the rendered response with the WHATWG
    # algorithm, so the tree under test is the one a browser builds.
    "html5lib==1.1",
    # Stub packages move independently of mypy and break it the same way.
    "types-requests==2.33.0.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wodbuster_worker"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "live_contract: hits the real WodBuster API; gated by RUN_LIVE_WODBUSTER=1",
]

[tool.djlint]
# Linting only, never reformatting: djlint is here to catch malformed
# markup (unclosed tags, invalid nesting, broken Jinja), which no other
# tool in the stack understands, and not to impose a house layout on
# hand-tuned templates.
profile = "jinja"
# Restricting to .html deliberately leaves out
# templates/email/notification.html.jinja, whose inline styles are
# mandatory for mail clients and would trip the inline-style rule.
extension = "html"
# J004 expects the Flask/Django url_for('static') idiom. Static files are
#      mounted here at a fixed /static prefix and no such global exists.
# H030/H031 ask for meta description and keywords: SEO hints for indexed
#      public pages, while every page here sits behind a login (and the
#      keywords tag has been ignored by search engines for years).
# H044 rejects a <td> inside <thead>, which is exactly how the action
#      columns are marked up: those columns carry no header text, and an
#      empty <th> is announced as a header with no name. The repo's own
#      accessibility suite fails that markup (tests/component/a11y.py),
#      so the two checks cannot both be satisfied and the tested one wins.
ignore = "J004,H030,H031,H044"
