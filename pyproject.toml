[project]
name = "wodbuster-worker"
version = "0.1.0"
description = "Unattended WodBuster Booking Scheduler (FastAPI + APScheduler + Postgres on Azure Container Apps)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WodBuster Booking Scheduler contributors" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "jinja2>=3.1,<4.0",
    "apscheduler>=3.10,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "curl-cffi>=0.13,<1.0",
    "structlog>=24.1,<26.0",
    "azure-identity>=1.19,<2.0",
    "azure-keyvault-secrets>=4.9,<5.0",
    "azure-communication-email>=1.0,<2.0",
    "authlib>=1.3,<2.0",
    "itsdangerous>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-telegram-bot>=21.0,<23.0",
    "cryptography>=43.0,<46.0",
    "pydantic-settings>=2.5,<3.0",
    # US2.6 observability: Azure Monitor OpenTelemetry distro. Ships
    # auto-instrumentation for FastAPI, httpx, SQLAlchemy and a
    # metrics + logs + traces exporter to Application Insights.
    "azure-monitor-opentelemetry>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    "djlint>=1.36,<2.0",
    # Accessibility audits parse the rendered response with the WHATWG
    # algorithm, so the tree under test is the one a browser builds.
    "html5lib>=1.1,<2.0",
    "types-requests",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wodbuster_worker"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "live_contract: hits the real WodBuster API; gated by RUN_LIVE_WODBUSTER=1",
]

[tool.djlint]
# Linting only, never reformatting: djlint is here to catch malformed
# markup (unclosed tags, invalid nesting, broken Jinja), which no other
# tool in the stack understands, and not to impose a house layout on
# hand-tuned templates.
profile = "jinja"
# Restricting to .html deliberately leaves out
# templates/email/notification.html.jinja, whose inline styles are
# mandatory for mail clients and would trip the inline-style rule.
extension = "html"
# J004 expects the Flask/Django url_for('static') idiom. Static files are
#      mounted here at a fixed /static prefix and no such global exists.
# H030/H031 ask for meta description and keywords: SEO hints for indexed
#      public pages, while every page here sits behind a login (and the
#      keywords tag has been ignored by search engines for years).
ignore = "J004,H030,H031"
