name: ci

on:
  # Runs once per pull request (the branch-protection required check via
  # `ci-gate`). No `push` trigger on `main`: a merge lands the exact tree the
  # PR already validated, so re-running CI post-merge would be redundant.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Every change runs the lint+type+test job, Markdown included:
          # tests/unit/test_public_site.py and test_public_docs.py check the
          # published documentation (links, diagrams, site configuration).
          # Do not add a Markdown exclusion here. With the default predicate
          # quantifier a negated pattern excludes nothing, which is why the
          # previous `!**/*.md` entry never skipped a run.
          filters: |
            code:
              - '**'

  check:
    name: ruff, mypy, djlint, pytest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      # Postgres 16 service container: matches the local docker-compose
      # setup (F1.7) and the prod SKU (F3.11). Component tests in
      # tests/component/test_migrations.py connect here to exercise the
      # real Alembic baseline against a real Postgres.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wodbuster
          POSTGRES_PASSWORD: wodbuster
          POSTGRES_DB: wodbuster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wodbuster -d wodbuster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wodbuster
      POSTGRES_USER: wodbuster
      POSTGRES_PASSWORD: wodbuster
      WODBUSTER_ENV: local

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src

      - name: djlint
        run: djlint src/wodbuster_worker/templates --lint

      - name: pytest
        run: pytest -m "not live_contract"

  ci-gate:
    # Single required status check for the `main` branch ruleset. It
    # always runs, so the required check is never left pending. It passes
    # when the heavy job succeeded or was skipped, and fails only when the
    # heavy job actually failed or was cancelled.
    name: ci-gate
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate the check job result
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          echo "check job result: ${CHECK_RESULT}"
          if [ "${CHECK_RESULT}" = "success" ] || [ "${CHECK_RESULT}" = "skipped" ]; then
            echo "CI gate passed."
            exit 0
          fi
          echo "CI gate failed: the check job did not succeed."
          exit 1
