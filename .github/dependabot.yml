version: 2
updates:
  # Every action is pinned to a commit SHA with its release in a trailing comment;
  # Dependabot updates both together, so the pins do not go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - "area: ci"
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
