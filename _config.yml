# GitHub Pages (branch mode) configuration.
#
# GitHub builds the `main` branch with Jekyll on every push and serves the result, with
# README.md as the home page. No workflow in this repository is involved.
#
# Only public documentation is published. Jekyll offers an exclude list, not an allow-list,
# so `tests/unit/test_public_site.py` fails when a tracked top-level path is neither
# published on purpose nor excluded here. Add every new code or tooling directory below.

title: WodBuster Booking Scheduler
description: Unattended service that books your CrossFit classes the instant the booking window opens.
theme: jekyll-theme-cayman
show_downloads: false

# GitHub Pages serves Markdown files named like community files (CONTRIBUTING,
# CODE_OF_CONDUCT and others) as raw text unless they carry front matter or are listed here,
# so the published ones are listed rather than edited.
include:
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md

exclude:
  # Encrypted at rest. The build would otherwise publish age ciphertext as broken pages.
  - docs/internal/
  - src/
  - tests/
  - infra/
  - alembic/
  - docker/
  - scripts/
  - site/
  - "*.py"
  - "*.toml"
  - "*.ini"
  - "*.ps1"
  - azure.yaml
  - Dockerfile
  - docker-compose.yml
  - Makefile
